<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 890" width="1160" height="890" font-family="Poppins, 'Open Sans', system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a7266"/>
    </marker>
  </defs>

  <rect width="1160" height="890" fill="#faf9f7"/>

  <!-- Conectores -->
  <g fill="none" stroke="#a29a89" stroke-width="2.5">
    <path d="M580 94 V120 H320 V132" marker-end="url(#arrow)"/>
    <path d="M580 120 H880 V132" marker-end="url(#arrow)"/>
    <path d="M320 168 V210" marker-end="url(#arrow)"/>
    <path d="M880 168 V350" marker-end="url(#arrow)"/>
    <path d="M320 274 V300 H140 V350" marker-end="url(#arrow)"/>
    <path d="M320 300 H440 V350" marker-end="url(#arrow)"/>
    <path d="M440 414 V490" marker-end="url(#arrow)"/>
    <path d="M560 382 H760" marker-end="url(#arrow)"/>
    <path d="M880 414 V490" marker-end="url(#arrow)"/>
    <path d="M880 554 V590 H760 V630" marker-end="url(#arrow)"/>
    <path d="M880 590 H1020 V630" marker-end="url(#arrow)"/>
    <path d="M140 426 V760 M440 566 V760 M760 706 V760 M1020 706 V760 M140 760 H1020"/>
    <path d="M580 760 V800" marker-end="url(#arrow)"/>
  </g>

  <!-- Etiquetas de las ramas -->
  <g font-size="15" font-weight="600" fill="#5c554b">
    <text x="150" y="330">Sí</text>
    <text x="450" y="330">No</text>
    <text x="452" y="458">Sí</text>
    <text x="640" y="370" text-anchor="middle">No</text>
    <text x="770" y="620">Coper</text>
    <text x="1030" y="620">Non-coper</text>
  </g>

  <!-- Inicio -->
  <rect x="420" y="30" width="320" height="64" rx="16" fill="#2c4a3e"/>
  <text x="580" y="62" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="700" fill="#ffffff">Rotura de LCA</text>

  <!-- Vías -->
  <g font-size="14" font-weight="600" fill="#233b32" text-anchor="middle" dominant-baseline="middle">
    <rect x="180" y="132" width="280" height="36" rx="18" fill="#d2e1db"/>
    <text x="320" y="150">Vía de tratamiento temprano</text>
    <rect x="740" y="132" width="280" height="36" rx="18" fill="#d2e1db"/>
    <text x="880" y="150">Vía de tratamiento demorado</text>
  </g>

  <!-- Preguntas -->
  <g font-size="17" font-weight="600" fill="#233b32" text-anchor="middle" dominant-baseline="middle">
    <rect x="200" y="210" width="240" height="64" rx="14" fill="#eaf1ee" stroke="#7eac98" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="320" y="242">¿Lesiones asociadas?</text>
    <rect x="320" y="350" width="240" height="64" rx="14" fill="#eaf1ee" stroke="#7eac98" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="440" y="382">¿Candidato al CBP?</text>
    <rect x="760" y="490" width="240" height="64" rx="14" fill="#eaf1ee" stroke="#7eac98" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="880" y="522">¿Coper o non-coper?</text>
  </g>

  <!-- Tratamientos conservadores -->
  <g text-anchor="middle" dominant-baseline="middle" fill="#233b32">
    <rect x="760" y="350" width="240" height="64" rx="14" fill="#ffffff" stroke="#549077" stroke-width="2"/>
    <text x="880" y="382" font-size="16" font-weight="600">Rehabilitación ≥ 3 meses</text>

    <rect x="320" y="490" width="240" height="76" rx="14" fill="#ffffff" stroke="#549077" stroke-width="2"/>
    <text x="440" y="518" font-size="16" font-weight="600">Cross Bracing Protocol</text>
    <text x="440" y="542" font-size="13" fill="#5c554b">Rodillera a 90º · 12 semanas</text>

    <rect x="640" y="630" width="240" height="76" rx="14" fill="#ffffff" stroke="#549077" stroke-width="2"/>
    <text x="760" y="658" font-size="16" font-weight="600">Sin cirugía</text>
    <text x="760" y="682" font-size="13" fill="#5c554b">Rehab + trabajo neuromuscular</text>
  </g>

  <!-- Cirugía -->
  <g text-anchor="middle" dominant-baseline="middle" fill="#551f27">
    <rect x="20" y="350" width="240" height="76" rx="14" fill="#fbeaec" stroke="#d17380" stroke-width="2"/>
    <text x="140" y="378" font-size="16" font-weight="600">Cirugía temprana</text>
    <text x="140" y="402" font-size="13" fill="#6b2730">Tras 2 semanas de rehab</text>

    <rect x="900" y="630" width="240" height="76" rx="14" fill="#fbeaec" stroke="#d17380" stroke-width="2"/>
    <text x="1020" y="658" font-size="16" font-weight="600">Reconstrucción del LCA</text>
    <text x="1020" y="682" font-size="13" fill="#6b2730">Con prehabilitación previa</text>
  </g>

  <!-- Vuelta al deporte -->
  <rect x="220" y="800" width="720" height="64" rx="16" fill="#2c4a3e"/>
  <text x="580" y="832" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="600" fill="#ffffff">Vuelta al deporte: mínimo 9–12 meses de rehabilitación</text>
</svg>
